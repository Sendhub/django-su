[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django_su"
description = "Switch user (su) support for the Django admin — SendHub fork"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]

authors = [
  { name = "SendHub", email = "support@sendhub.com" },
  { name = "Dipayan Ray", email = "dipayan.ray@euphoricthought.com" },
]
urls = { Home = "https://sendhub.com/" }
keywords = ["django", "su", "switch-user", "admin", "impersonation"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 6.0",
]

dependencies = [
  "Django>=3.2",
]

[project.optional-dependencies]
dev = [
  "coveralls",
  "django-ajax-selects",
  "django-form-admin",
  "pytest-cov>=4.0",
  "pytest-django>=4.0",
  "pytest-sugar>=1.0",
  "pytest>=7.0",
  "ruff",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_su", "django_su.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"django_su" = [
  "VERSION",
  "locale/**/*.po",
  "locale/**/*.mo",
  "templates/**/*.html",
]

[tool.setuptools.dynamic.version]
attr = "django_su.version.VERSION"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["django_su/tests"]
DJANGO_SETTINGS_MODULE = "test_settings"
norecursedirs = ["venv", ".venv", "node_modules", "*.egg-info", "build", "dist"]
addopts = [
  "-ra",
  "-q",
  "--tb=short",
  "--durations=5",
  "--cov=django_su",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=95",
  "-p", "no:warnings",
]
